{% extends "base.html" %}
{% block title %}Entrar · {{ site_name }}{% endblock %}
{% block edicion %}Acceso{% endblock %}

{% block content %}
{% if request.query_params.get('error') %}
  <div class="aviso">Token incorrecto.</div>
{% endif %}
<form method="post" action="/login"
      style="display:flex;gap:.6rem;margin:3rem auto;max-width:26rem">
  <input type="password" name="token" placeholder="Token de acceso"
         style="flex:1" autofocus required/>
  <button type="submit" class="primary">Entrar</button>
</form>
{% endblock %}
